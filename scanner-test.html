<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZamexCards AI Scanner Test</title>
<style>
body{margin:0;background:#031b34;color:#fff;font-family:Arial,sans-serif}
main{max-width:760px;margin:auto;padding:22px}
.card{background:#082b50;border:1px solid #39ce58;border-radius:18px;padding:20px}
h1{margin-top:0}.btn{display:inline-block;background:#45cc59;color:#fff;border:0;border-radius:12px;padding:14px 18px;font-weight:800;font-size:16px}
img{display:none;max-width:100%;max-height:600px;margin:18px auto;border-radius:14px}
pre{white-space:pre-wrap;background:#031a31;border-radius:12px;padding:16px;min-height:80px;font-size:15px}
small{color:#acd0e5}
</style>
</head>
<body><main><div class="card">
<h1>ZamexCards AI Scanner Test</h1>
<p>Kies één Pokémonkaart-foto. Deze pagina test alleen wat de AI herkent.</p>
<input id="file" type="file" accept="image/*">
<button id="go" class="btn">AI scan uitvoeren</button>
<img id="preview">
<p id="status"></p>
<pre id="out">Nog geen scan uitgevoerd.</pre>
<small>Je API-sleutel wordt nooit naar deze browserpagina gestuurd. Alleen de foto gaat naar /api/scan.</small>
</div></main>
<script>
const $=id=>document.getElementById(id);
$('file').onchange=()=>{
  const f=$('file').files?.[0]; if(!f)return;
  const r=new FileReader(); r.onload=()=>{$('preview').src=r.result;$('preview').style.display='block'};r.readAsDataURL(f);
};
$('go').onclick=async()=>{
  const f=$('file').files?.[0]; if(!f){alert('Kies eerst een foto.');return}
  $('status').textContent='AI bekijkt de kaart…'; $('out').textContent='';
  const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});
  try{
    const res=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:data})});
    const json=await res.json();
    $('out').textContent=JSON.stringify(json,null,2);
    $('status').textContent=res.ok?'Klaar.':'Fout.';
  }catch(e){$('status').textContent='Fout.';$('out').textContent=String(e)}
};
</script>
</body></html>
