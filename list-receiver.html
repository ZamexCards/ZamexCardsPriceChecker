<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>ZamexCards List Receiver</title></head><body><script>
(function(){
 const KEY="zc_favs";
 const allowed=o=>{try{const u=new URL(o);return o==="https://zamexcards.github.io"||(u.protocol==="https:"&&u.hostname.endsWith(".vercel.app"))}catch{return false}};
 const get=()=>{try{const x=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(x)?x:[]}catch{return[]}};
 window.addEventListener("message",e=>{
  if(!allowed(e.origin))return;const m=e.data||{};if(m.type!=="ZC_ADD_TO_LIST"||!m.requestId||!m.item)return;
  try{
   const item=m.item;if(!item.id||!item.name||!item.listId)throw new Error("Ongeldige kaartgegevens.");
   const list=get(),old=list.find(x=>x.listId===item.listId);let q=1;
   if(old){old.quantity=Math.max(1,Number(old.quantity)||1)+1;old.prices=item.prices||old.prices;old.image=item.image||old.image;old.addedViaScanner=true;q=old.quantity}
   else list.push({...item,quantity:1,addedViaScanner:true});
   localStorage.setItem(KEY,JSON.stringify(list));e.source?.postMessage({type:"ZC_LIST_ACK",requestId:m.requestId,ok:true,quantity:q},e.origin)
  }catch(err){e.source?.postMessage({type:"ZC_LIST_ACK",requestId:m.requestId,ok:false,error:err?.message||"Toevoegen mislukt."},e.origin)}
 })
})();
</script></body></html>
